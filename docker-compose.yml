services:
  biblioteca:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - dados:/dados
      - capas:/app/frontend/assets
      - backups:/app/backup
    restart: unless-stopped
    environment:
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GOOGLE_URL_RETORNO
      - GOOGLE_DOMINIOS

volumes:
  dados:
  capas:
  backups:
